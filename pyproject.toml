[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-cli"
version = "0.1.0"
description = "CLI não oficial para o Google Flow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
flow = "flow_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
